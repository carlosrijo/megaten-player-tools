[workspace]
resolver = "3"
members = ["crates/newmoon", "crates/newmoon-reader", "crates/newmoon-tracker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
# "z" (smallest code) instead of 3: the tracker exe goes from 10.3 MB to 8.4 MB.
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
debug = false
