[workspace]
resolver = "3"
members = ["crates/imagine", "crates/imagine-reader", "crates/imagine-tracker"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"

[profile.release]
# "z" (smallest code) instead of 3: the tracker exe goes from 10.3 MB to 8.4 MB.
opt-level = "z"
lto = "fat"
codegen-units = 1
# Symbols stay in the build, and on MSVC that means a separate .pdb beside the exe: the exe itself only carries the
# .pdb's file name, so it does not grow (measured in HANDOVER.md, "Troubleshooting"). tools\publish-portable.ps1 keeps
# the .pdb out of the release and the release workflow stores it as an artifact: with it a crash report's
# BABEL.exe+0xOFFSET lines become functions and lines (imagine-reader symbolize). "line-tables-only" is enough
# for that (functions, files, lines; no variables) and keeps the .pdb at about 27 MB.
strip = false
debug = "line-tables-only"
