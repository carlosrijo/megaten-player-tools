[package]
name = "imagine-tracker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BABEL: the desktop window (WebView2) around the read-only IMAGINE reader"

[dependencies]
anyhow = "1.0.105"
imagine = { version = "0.10.0", path = "../imagine" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
base64 = "0.22.1"
chrono = "0.4.45"
sha2 = "0.11"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
rust-embed = { version = "8.14.0", features = ["compression", "include-exclude"] }
tao = "0.37.3"
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
] }

[build-dependencies]
winresource = "0.1.34"

[[bin]]
name = "BABEL"
path = "src/main.rs"

[features]
# Test builds only: keeps the `debugPanic` page command (a panic on purpose, to look at the crash report) in a release
# build, which has it off. Never on in a shipped exe.
crash-test = []
