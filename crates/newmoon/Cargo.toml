[package]
name = "newmoon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
encoding_rs = "0.8.44"
fancy-regex = "0.20.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
indexmap = { version = "2.14.2", features = ["serde"] }
regex = "1.13.2"
roxmltree = "0.21.2"
rust-embed = { version = "8.14.0", features = ["compression", "include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tiny_http = "0.12.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_UI_WindowsAndMessaging"] }
