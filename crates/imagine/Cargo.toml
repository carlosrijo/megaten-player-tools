[package]
name = "imagine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
chrono = "0.4.45"
encoding_rs = "0.8.44"
fancy-regex = "0.20.2"
flate2 = "1.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
indexmap = { version = "2.14.2", features = ["serde"] }
regex = "1.13.2"
roxmltree = "0.21.2"
rust-embed = { version = "8.14.0", features = ["compression", "include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2.0.21"
tiny_http = "0.12.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
# the support bundle: deflate through flate2's own Rust backend (already in the build for PNG), nothing else
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }

[build-dependencies]
sha2 = "0.11"
