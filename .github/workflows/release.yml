# Release: build the portable BABEL.exe (one file, nothing to install; see tools/publish-portable.ps1).
#
#   Push a version tag   ->  builds the exe and publishes a GitHub release with it (notes from release-notes/<tag>.md):
#       git tag v1.2.0
#       git push origin v1.2.0
#     A tag with a dash (v1.2.0-beta.1) makes a pre-release.
#   Run it by hand (Actions > Release > Run workflow)  ->  only builds the exe, kept as the run's artifact for testing.
# A release has BABEL.exe, BABEL.exe.sha256 and BABEL.exe.sig: the signature the app's updater checks before it installs
# a new version (crates/imagine-tracker/src/update.rs). It is made with the BABEL_UPDATE_KEY secret; a tag fails without it.
# Either way the exe's debug symbols (BABEL.pdb) are kept as a second artifact, "BABEL-symbols-<version>": not a
# release asset, only for reading the crash reports of that exact build (HANDOVER.md).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # to create the release

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Rust (stable, MSVC) builds the exe; the runner image has rustup and the Visual Studio C++ build tools
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
          cargo --version

      # Downloaded crates only. target\ is never cached: the build puts the key of reference\sealed\ into it, and a cache
      # made on master can be restored by any pull request's workflow.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # The sealed data is in git only encrypted (reference\sealed\). Stop if a local file, a key or tokusei XML outside
      # reference\bundled\tokusei\ was committed by mistake.
      - name: Check the sealed data
        shell: pwsh
        run: |
          $bad = @(git ls-files | Where-Object { $_ -match '(?i)(\.local\.json$|(^|/)\.secrets/|pack\.key$)' })
          $bad += @(git ls-files '*.xml' '*.json' '*.tsv' | Where-Object { $_ -notmatch '^reference/bundled/tokusei/' -and (Select-String -LiteralPath $_ -Pattern 'name="Tokusei"' -SimpleMatch -Quiet) })
          if ($bad) { Write-Error "Not for git: $($bad -join ', ')"; exit 1 }
          if (-not $env:BABEL_PACK_KEY) { Write-Warning 'No BABEL_PACK_KEY secret: this exe is built without the sealed data.' }
        env:
          BABEL_PACK_KEY: ${{ secrets.BABEL_PACK_KEY }}

      - name: Version from the tag
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '0.0.0-dev' }
          "version=$v" >> $env:GITHUB_OUTPUT

      # BABEL_PACK_KEY opens reference\sealed\data.bin; crates\imagine\build.rs puts it in the exe scrambled. Never echo it.
      - name: Build the portable exe
        shell: pwsh
        run: ./tools/publish-portable.ps1 -Version '${{ steps.ver.outputs.version }}'
        env:
          BABEL_PACK_KEY: ${{ secrets.BABEL_PACK_KEY }}

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/BABEL.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  BABEL.exe" | Out-File dist/BABEL.exe.sha256 -Encoding ascii

      # The updater's signature (crates/imagine-tracker/src/update.rs): players' BABEL installs a new version only when
      # this checks with the public key built into it. What is signed: "BABEL.exe <version> <sha-256>" (the version too,
      # so an old exe can't be offered as a new one). BABEL_UPDATE_KEY is the private key (P-256, PKCS#8, base64), also
      # kept in .secrets\ on the maintainer's PC. Never echo it.
      - name: Sign for the updater
        shell: pwsh
        env:
          BABEL_UPDATE_KEY: ${{ secrets.BABEL_UPDATE_KEY }}
        run: |
          if (-not $env:BABEL_UPDATE_KEY) {
            if ('${{ github.ref_type }}' -eq 'tag') { Write-Error 'No BABEL_UPDATE_KEY secret: players'' BABEL would refuse this release as an update.'; exit 1 }
            Write-Warning 'No BABEL_UPDATE_KEY secret: this test build is not signed.'
            exit 0
          }
          $h = (Get-Content dist/BABEL.exe.sha256 -Raw).Split(' ')[0].Trim()
          $ec = [Security.Cryptography.ECDsa]::Create()
          $read = 0
          $ec.ImportPkcs8PrivateKey([Convert]::FromBase64String($env:BABEL_UPDATE_KEY.Trim()), [ref]$read)
          $msg = [Text.Encoding]::UTF8.GetBytes("BABEL.exe ${{ steps.ver.outputs.version }} $h")
          [Convert]::ToBase64String($ec.SignData($msg, [Security.Cryptography.HashAlgorithmName]::SHA256)) | Out-File dist/BABEL.exe.sig -Encoding ascii -NoNewline

      - uses: actions/upload-artifact@v7
        with:
          name: BABEL-${{ steps.ver.outputs.version }}
          path: dist/*

      # The debug symbols of this exact exe, for reading its crash reports (HANDOVER.md, "Symbolizing a crash"). A workflow
      # artifact only: never a release asset, so users do not download them.
      - uses: actions/upload-artifact@v7
        with:
          name: BABEL-symbols-${{ steps.ver.outputs.version }}
          path: dist-symbols/BABEL.pdb
          retention-days: 365

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          # The SHA-256 goes in the notes too, so a player can check the exe against the page without downloading the
          # .sha256 file (README.md, "Check the download"). --notes is put above the generated notes.
          $h = (Get-Content dist/BABEL.exe.sha256 -Raw).Split(' ')[0].Trim()
          # What's new: release-notes/<tag>.md, written by hand for players (README.md, "Making a release"). It goes first;
          # the SHA-256 block follows it. With no such file the release has only the SHA-256 block and the compare link.
          $notesFile = "release-notes/$tag.md"
          $whatsNew = if (Test-Path $notesFile) { (Get-Content $notesFile -Raw).Trim() + "`n`n" } else { '' }
          $notes = $whatsNew + (@(
            '### Check the download'
            ''
            'SHA-256 of `BABEL.exe`:'
            ''
            '```'
            $h
            '```'
            ''
            'In PowerShell, in the folder with the exe:'
            ''
            '```powershell'
            '(Get-FileHash .\BABEL.exe -Algorithm SHA256).Hash'
            '```'
            ''
            'The two must match (capital or small letters do not matter). If they do not, do not run the exe.'
          ) -join "`n")
          # --generate-notes still adds the "Full Changelog" compare link under the notes.
          $flags = @('--title', "BABEL $tag", '--notes', $notes, '--generate-notes')
          if ($tag -like '*-*') { $flags += '--prerelease' }
          gh release create $tag dist/BABEL.exe dist/BABEL.exe.sha256 dist/BABEL.exe.sig @flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
