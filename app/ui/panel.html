<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The quest panel: a small window BABEL keeps above the game (main.rs Panel). It shows the next step of the quests
       in progress, from the quest progress the app sends it. Same rules as the main page: its own files
       only. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BABEL quests</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="app.css">
  <style>
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font-size: 12px; display: flex; flex-direction: column; }
    .p-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 10px; background: var(--surface); border-bottom: 1px solid var(--border); cursor: move; user-select: none; }
    .p-head b { flex: 1; font-size: 12px; }
    .p-head .p-zone { color: var(--text-2); font-weight: 400; }
    .p-btn { border: 0; background: none; color: var(--text-2); font: inherit; font-size: 14px; line-height: 1; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
    .p-btn:hover { background: var(--surface-2); color: var(--text); }
    .p-body { flex: 1; overflow-y: auto; padding: 4px 6px 8px; display: grid; align-content: start; gap: 2px; }
    /* one compact line per quest; opened, its next step below */
    .p-quest { display: grid; gap: 4px; border-radius: 6px; }
    .p-quest.open { background: var(--surface); padding-bottom: 8px; }
    .p-quest.hidden .p-name { color: var(--text-2); font-weight: 400; }
    .p-quest.hidden .p-chev { visibility: hidden; }
    /* the hidden quests: a section first that opens and closes */
    .p-section { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; color: var(--text-2); cursor: pointer; user-select: none; }
    .p-section:hover { background: var(--surface-2); color: var(--text); }
    .p-section:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .p-hidden { display: grid; gap: 2px; padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
    .icon { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .p-hide { display: inline-flex; align-items: center; padding: 3px; }
    .p-title { display: flex; align-items: center; gap: 6px; font-weight: 600; padding: 4px 4px 4px 6px; border-radius: 6px; cursor: pointer; user-select: none; }
    .p-title:hover { background: var(--surface-2); }
    .p-title:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .p-chev { flex: none; width: 10px; color: var(--text-3); font-size: 10px; }
    .p-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p-title .tag { flex: none; height: 16px; font-size: 10px; padding: 0 6px; }
    .p-hide { flex: none; font-size: 13px; padding: 0 5px; }
    .p-steps { display: grid; gap: 4px; padding: 0 8px 0 22px; }
    .p-more { margin-top: 6px; border: 0; background: none; color: var(--text-2); font: inherit; text-decoration: underline; cursor: pointer; justify-self: start; padding: 2px 6px; }
    .p-do { line-height: 1.45; }
    .p-picks { display: flex; flex-wrap: wrap; gap: 4px; align-items: baseline; }
    .p-picks .q-arrow { color: var(--text-3); }
    .p-note { color: var(--text-2); }
    .p-goal-met { color: var(--text-2); }
    .p-empty { color: var(--text-2); line-height: 1.5; }
    .q-pick { padding: 1px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--border); }
    .q-live-tag { border-color: var(--accent-edge); background: var(--accent); color: var(--accent-ink); }
    .q-here-tag { border-color: var(--accent); color: var(--text); }
  </style>
</head>
<body>
  <div class="p-head" id="head"><b>BABEL · Quests <span class="p-zone" id="zone"></span></b><button class="p-btn" id="close" type="button" title="Hide (open it again from the Quest Tracker)" aria-label="Hide the panel">×</button></div>
  <div class="p-body" id="body"><p class="p-empty">Reading the game…</p></div>
  <script src="panel.js"></script>
</body>
</html>
